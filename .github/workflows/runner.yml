name: Runner Bot

on:
  repository_dispatch:
    types: [process-file]
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # cache pip dependencies — saves ~10s

      - name: Install dependencies
        run: pip install telethon aiohttp  # cached after first run

      - name: Restore Telethon session
        env:
          TELETHON_SESSION_B64: ${{ secrets.TELETHON_SESSION_B64 }}
        run: |
          echo "$TELETHON_SESSION_B64" | base64 -d > runner_session.session

      - name: Run runner bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python runner_bot.py
