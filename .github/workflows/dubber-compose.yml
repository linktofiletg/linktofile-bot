name: Dubber Step 2 - Compose Dubbed Video

on:
  repository_dispatch:
    types: [dubber-compose]
  workflow_dispatch:

jobs:
  dubber-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg (static build)
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run compositor
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python dubber_compose.py

      - name: Upload dubbed video
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-${{ github.event.client_payload.job_id }}
          path: output/
