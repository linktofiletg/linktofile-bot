name: Dubber Step 1 - TTS to Timestamps

on:
  repository_dispatch:
    types: [dubber-tts]
  workflow_dispatch:

jobs:
  dubber-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install faster-whisper

      - name: Run Whisper large-v3 on TTS audio
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python dubber_tts.py

      - name: Upload transcript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tts-transcript-${{ github.event.client_payload.job_id }}
          path: output/

